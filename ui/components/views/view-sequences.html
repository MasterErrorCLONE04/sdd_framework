<!-- 3. PERSPECTIVA SECUENCIAS & ESTADOS (UML) -->
<main id="view-sequences" class="tab-content hidden max-w-6xl mx-auto space-y-6">
  <div class="bg-white border border-zinc-200 rounded-2xl p-6 shadow-xs space-y-5">
    
    <!-- Header & Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-zinc-100">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-black bg-purple-50 text-purple-700 border border-purple-200 uppercase tracking-wider">
            UML Architecture Suite
          </span>
          <span class="text-xs text-zinc-400 font-medium">• Diagramas de Secuencia y Máquinas de Estado</span>
        </div>
        <h2 class="text-xl font-black text-zinc-950 mt-1 flex items-center gap-2.5">
          <i data-lucide="workflow" class="w-6 h-6 text-purple-600"></i>
          Diagramas UML e Interacción de Procesos
        </h2>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <!-- Diagram Type Switcher -->
        <div class="bg-zinc-100 p-1 rounded-xl flex items-center gap-1 border border-zinc-200 text-xs font-bold">
          <button id="uml-mode-sequence" onclick="switchUmlType('sequence')" class="px-3 py-1.5 rounded-lg bg-white text-purple-950 shadow-2xs font-black flex items-center gap-1.5 transition-all cursor-pointer">
            <i data-lucide="git-commit" class="w-3.5 h-3.5 text-purple-600"></i>
            <span id="uml-tab-seq-label">Secuencias UML</span>
          </button>
          <button id="uml-mode-state" onclick="switchUmlType('state')" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-950 flex items-center gap-1.5 transition-all cursor-pointer">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-indigo-600"></i>
            <span id="uml-tab-fsm-label">Máquinas de Estado FSM</span>
          </button>
        </div>

        <div class="h-6 w-px bg-zinc-200 hidden sm:block"></div>

        <button onclick="toggleMermaidRaw()" id="btn-toggle-mermaid" class="px-3 py-1.5 rounded-xl text-xs font-bold border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-700 flex items-center gap-1.5 shadow-2xs transition-all cursor-pointer">
          <i data-lucide="code" class="w-3.5 h-3.5"></i>
          <span id="btn-toggle-mermaid-text">Ver Código</span>
        </button>
        <button onclick="copyMermaid()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 text-white hover:bg-zinc-800 flex items-center gap-1.5 shadow-2xs transition-all cursor-pointer">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span>Copiar Mermaid</span>
        </button>
      </div>
    </div>

    <!-- Sub-selector Pills (Flows / Diagrams List) -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs font-bold text-zinc-500">
        <span id="uml-selector-title">Flujos y Diagramas Disponibles:</span>
        <span id="uml-selector-count" class="font-mono text-[11px] text-purple-600 font-bold">1 seleccionado</span>
      </div>
      <div id="uml-pills-container" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-thin">
        <!-- Injected diagram buttons -->
      </div>
    </div>

    <!-- Active Diagram Metadata Header -->
    <div id="uml-metadata-card" class="p-4 rounded-xl bg-purple-50/50 border border-purple-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="space-y-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span id="uml-diag-badge" class="px-2 py-0.5 rounded-md text-[10px] font-mono font-bold bg-purple-100 text-purple-800 uppercase">SEQ-01</span>
          <span id="uml-diag-flow" class="px-2 py-0.5 rounded-md text-[10px] font-mono font-bold bg-white text-zinc-700 border border-purple-200">Flujo: Catálogo</span>
        </div>
        <h3 id="uml-diag-title" class="text-sm font-black text-zinc-950">Título de la Secuencia</h3>
        <p id="uml-diag-desc" class="text-xs text-zinc-600 max-w-3xl leading-relaxed">Descripción del diagrama</p>
      </div>
      <div id="uml-diag-actors" class="flex flex-wrap items-center gap-1.5 shrink-0 max-w-sm">
        <!-- Actor tags -->
      </div>
    </div>

    <!-- Rendered Visual Diagram Container -->
    <div id="mermaid-render-container" class="bg-zinc-50/70 rounded-2xl p-6 border border-zinc-200/90 shadow-2xs overflow-x-auto flex justify-center items-center min-h-[400px]">
      <div id="mermaid-svg-output" class="w-full flex justify-center overflow-x-auto"></div>
    </div>

    <!-- Raw Mermaid Code Box (collapsible) -->
    <div id="mermaid-raw-box" class="hidden bg-zinc-950 rounded-2xl p-5 text-emerald-400 font-mono text-xs overflow-x-auto border border-zinc-800">
      <pre id="mermaid-code-view">sequenceDiagram...</pre>
    </div>

  </div>
</main>
