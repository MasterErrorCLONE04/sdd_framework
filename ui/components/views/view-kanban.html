<!-- 11. PERSPECTIVA KANBAN SPRINT -->
<main id="view-kanban" class="tab-content hidden max-w-6xl mx-auto space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full min-h-[500px]">
    <!-- To Do -->
    <div class="bg-zinc-100/80 border border-zinc-200/80 rounded-2xl p-4 flex flex-col space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-zinc-200">
        <span class="text-xs font-black text-zinc-700 uppercase tracking-wider">Backlog / Por Hacer</span>
        <span id="kanban-badge-todo" class="px-1.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white text-zinc-700 shadow-xs">0</span>
      </div>
      <div id="kanban-col-todo" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>

    <!-- In Progress -->
    <div class="bg-zinc-100/80 border border-zinc-200/80 rounded-2xl p-4 flex flex-col space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-zinc-200">
        <span class="text-xs font-black text-amber-700 uppercase tracking-wider">En Curso (In Progress)</span>
        <span id="kanban-badge-inprog" class="px-1.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-100 text-amber-800 shadow-xs">0</span>
      </div>
      <div id="kanban-col-inprog" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>

    <!-- Done -->
    <div class="bg-zinc-100/80 border border-zinc-200/80 rounded-2xl p-4 flex flex-col space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-zinc-200">
        <span class="text-xs font-black text-emerald-700 uppercase tracking-wider">Completado (Done)</span>
        <span id="kanban-badge-done" class="px-1.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-100 text-emerald-800 shadow-xs">0</span>
      </div>
      <div id="kanban-col-done" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>
  </div>
</main>
