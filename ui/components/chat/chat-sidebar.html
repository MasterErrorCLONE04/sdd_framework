<!-- LEFT SIDEBAR: Chat & Project History -->
<aside id="chat-sidebar" class="w-64 bg-white border-r border-zinc-200 flex flex-col justify-between p-3.5 shrink-0 transition-all duration-300 z-30 select-none shadow-sm">
  <div class="space-y-3 flex-1 flex flex-col overflow-hidden">
    <!-- New Project Button -->
    <button
      onclick="startNewChatProject()"
      class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-xs font-bold text-purple-900 transition-all border border-purple-200 shadow-xs group cursor-pointer"
    >
      <span class="flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4 text-purple-600 group-hover:rotate-90 transition-transform"></i>
        <span>Nuevo Proyecto SDD</span>
      </span>
      <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white text-purple-800 border border-purple-200 shadow-xs">Ctrl+N</span>
    </button>

    <!-- Functional Chat / Project History -->
    <div class="space-y-1.5 flex-1 flex flex-col overflow-hidden pt-1">
      <div class="text-[10px] font-extrabold uppercase tracking-wider text-zinc-400 px-2 flex items-center justify-between">
        <span>Historial de Chats & Specs</span>
        <div class="flex items-center gap-1.5">
          <button
            onclick="clearAllChatSessions()"
            class="text-[9px] font-medium text-zinc-400 hover:text-rose-600 transition-colors cursor-pointer px-1 py-0.5 rounded hover:bg-zinc-100"
            title="Vaciar historial de este proyecto"
          >
            Limpiar
          </button>
          <i data-lucide="clock" class="w-3 h-3 text-purple-500"></i>
        </div>
      </div>
      <div id="chat-history-list" class="space-y-1 overflow-y-auto flex-1 pr-1">
        <!-- Populated dynamically via JS -->
      </div>
    </div>

    <!-- Framework Active Contracts Card -->
    <div class="pt-2 border-t border-zinc-100 space-y-1.5">
      <div class="p-2.5 rounded-xl bg-purple-50/60 border border-purple-200/80 text-[11px] space-y-1.5">
        <div class="flex items-center gap-1.5 text-purple-900 font-bold text-[11px]">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-purple-600"></i>
          <span>Gobernanza SDD Activa</span>
        </div>
        <div class="flex items-center justify-between text-[10px] text-zinc-600">
          <span class="font-mono text-purple-700">AGENTS.md</span>
          <span class="text-emerald-700 font-bold uppercase text-[9px]">Vigente</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar Footer / Workspace Info -->
  <div class="border-t border-zinc-200 pt-3 space-y-2 shrink-0">
    <div class="p-2.5 rounded-xl bg-zinc-50 border border-zinc-200 text-[11px] space-y-1">
      <div class="flex items-center justify-between">
        <span class="text-zinc-500 font-bold">Workspace Activo:</span>
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      </div>
      <div id="chat-sidebar-workspace" class="text-zinc-800 font-mono text-[10px] truncate" title="Directorio local">
        Directorio Actual
      </div>
    </div>

    <div class="flex items-center justify-between px-1 text-[11px] text-zinc-500 font-medium">
      <div class="flex items-center gap-1.5">
        <i data-lucide="cpu" class="w-3.5 h-3.5 text-purple-600"></i>
        <span>Antigravity Hook</span>
      </div>
      <span class="text-[10px] text-emerald-600 font-bold">Conectado</span>
    </div>
  </div>
</aside>
