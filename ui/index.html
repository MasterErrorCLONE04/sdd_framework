<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-50 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">SDD Studio — Spec-Driven Development Workbench</title>
  
  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            '2xs': '0 1px 1px 0 rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>

  <!-- External Libraries: Lucide Icons & Mermaid.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Modular Studio Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen w-full bg-zinc-50 font-sans overflow-hidden select-none text-zinc-900">

  <!-- SCREEN 1: GENESIS CONVERSATIONAL CHAT -->
  <div id="screen-genesis-chat" class="flex h-screen w-full bg-zinc-50 text-zinc-900 overflow-hidden font-sans">
    <!-- Chat Sidebar Component -->
    <div data-component="components/chat/chat-sidebar.html"></div>
    
    <!-- Chat Main Area Component -->
    <div data-component="components/chat/chat-main.html"></div>
  </div>

  <!-- SCREEN 2: COCKPIT (12 PERSPECTIVAS COMPLETAS - EXECUTIVE SPLIT SHELL) -->
  <div id="screen-cockpit" class="hidden flex flex-col h-screen w-full bg-zinc-50 overflow-hidden font-sans">
    <!-- Executive Topbar Component -->
    <div data-component="components/cockpit/cockpit-header.html"></div>

    <!-- Cockpit Split Body -->
    <div class="flex flex-1 overflow-hidden relative">
      <!-- Cockpit Perspectives Sidebar Component -->
      <div data-component="components/cockpit/cockpit-sidebar.html"></div>

      <!-- Main Perspective Workspace: 12 Views Components -->
      <div id="cockpit-main-workspace" class="flex-1 overflow-y-auto bg-zinc-50 p-6 md:p-8">
        <div data-component="components/views/view-core.html"></div>
        <div data-component="components/views/view-discovery.html"></div>
        <div data-component="components/views/view-stories.html"></div>
        <div data-component="components/views/view-sequences.html"></div>
        <div data-component="components/views/view-flows.html"></div>
        <div data-component="components/views/view-architecture.html"></div>
        <div data-component="components/views/view-database.html"></div>
        <div data-component="components/views/view-roles.html"></div>
        <div data-component="components/views/view-qa.html"></div>
        <div data-component="components/views/view-drift.html"></div>
        <div data-component="components/views/view-uiux.html"></div>
        <div data-component="components/views/view-kanban.html"></div>
      </div>
    </div>
  </div>

  <!-- Modals & Feedback Overlays Components -->
  <div data-component="components/modals/dispatch-modal.html"></div>
  <div data-component="components/modals/openrouter-modal.html"></div>
  <div data-component="components/modals/genesis-modal.html"></div>
  <div data-component="components/modals/reverse-engineer-modal.html"></div>
  <div data-component="components/modals/toast.html"></div>
  <div data-component="components/modals/morph-overlay.html"></div>

  <!-- Application Master Controller (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
